<script>/* Team B demo helper */(function(){var d=document.documentElement;
function v(){d.setAttribute('data-view',(location.hash||'#dashboard').slice(1)||'dashboard')}
v();addEventListener('hashchange',v);
/* Shared text from ../data/content.json (Who to contact table, official floor plan link) */
fetch('../data/content.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){window.OOBS_DATA=j;dispatchEvent(new Event('oobs-data'));}).catch(function(){});
/* Presentation Demo: press the hotel map's own floor / day buttons (they are internal to Charlie's code) */
window.oobsMapPick=function(group,label){setTimeout(function(){
var seg=document.querySelector('.map-page .toolbar > .seg'+(group==='floors'?'.floors':':not(.floors)'));if(!seg)return;
var b=[].slice.call(seg.querySelectorAll('button')).filter(function(x){return group==='floors'?x.textContent.indexOf(label)>-1:x.textContent.trim()===label;})[0];
if(b&&!b.classList.contains('on'))b.click();},150);};
/* Presentation Demo: clicker keys. Right arrow, Page Down, Space = Next; Left arrow, Page Up = Back. */
function typing(a){if(!a)return false;var t=a.tagName;return a.isContentEditable||t==='TEXTAREA'||t==='SELECT'||(t==='INPUT'&&!/^(button|submit|reset|checkbox|radio|range|color|file)$/i.test(a.type));}
function key(e){return e.key===' '||e.key==='Spacebar'?'next':{ArrowRight:'next',PageDown:'next',ArrowLeft:'back',PageUp:'back'}[e.key];}
addEventListener('keydown',function(e){var tour=document.querySelector('.tour'),k=key(e);
if(!tour||!k||e.altKey||e.ctrlKey||e.metaKey||typing(document.activeElement))return;
e.preventDefault();e.stopPropagation();if(e.repeat)return;tourKey(k);},true);
function tourKey(k){var tour=document.querySelector('.tour');if(!tour)return;
var nav=tour.querySelectorAll('.tour-nav .btn'),b=k==='next'?nav[nav.length-1]:nav[0];if(b&&!b.disabled)b.click();}
/* clicker keys pressed while focus is inside the Ask OOBS chat panel */
addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.oobs==='tour-key')tourKey(e.data.k);});
/* stop Space also "pressing" whichever button has focus (that would skip a step) */
addEventListener('keyup',function(e){if(document.querySelector('.tour')&&key(e)==='next'&&!typing(document.activeElement))e.preventDefault();},true);
try{var k='oobs-planner-demo-ui-v1',u=JSON.parse(localStorage.getItem(k)||'{}');u.portalVol='v01';localStorage.setItem(k,JSON.stringify(u))}catch(e){}})();</script>

<style>/* Layout: fixed ink-purple sidebar + scrolling workspace of cards; volunteer portal is a single narrow column. */
:root {

  --fg: #EEEAF7; --fg-2: #CFC8E0; --muted: #A097B8;

  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .55);

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--fg); }
h1, h2, h3, h4, h5 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12px; } .nowrap { white-space: nowrap; } .grow { flex: 1; }
.sel { user-select: all; }
.ico { flex: none; display: inline-block; vertical-align: middle; }
.rot { transform: rotate(-90deg); } .rot180 { transform: rotate(180deg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; }
.sidebar { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; padding: 20px 14px 16px; padding-left: max(14px, env(safe-area-inset-left, 0px)); gap: 14px; overflow-y: auto; position: relative; z-index: 40; }
.logo { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.logo strong { display: block; font-family: var(--f-display); font-size: 17px; color: #fff; line-height: 1.1; }
.logo span { font-size: 12px; color: var(--side-mute); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.event-chip { background: var(--side-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border: 1px solid rgba(255, 255, 255, .06); }
.ev-name { color: #fff; font-weight: 700; font-size: 13px; }
.ev-meta { font-size: 11.5px; color: var(--side-mute); }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--side-fg); text-decoration: none; font-weight: 500; font-size: 13.5px; position: relative; flex-wrap: wrap; }
.nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav-item.active { background: linear-gradient(90deg, rgba(162, 125, 242, .28), rgba(162, 125, 242, .08)); color: #fff; }
.nav-item.active::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #A27DF2; }
.nav-item .ico { opacity: .85; }
.nav-count { margin-left: auto; background: #E0425C; color: #fff; font-style: normal; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.nav-tag { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #6FE0D8; margin-left: 29px; width: 100%; margin-top: -2px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.side-note { font-size: 11px; color: var(--side-mute); text-align: center; }
.reset-ask { background: var(--side-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: #fff; }
.reset-ask div { display: flex; gap: 6px; }
.main { overflow-y: auto; height: 100%; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.tb-title { min-width: 0; flex: 1; }
.crumb { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.topbar h1 { font-size: 22px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px 4px 4px 10px; color: var(--muted); }
.clock-lab { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.clock select { border: 0; background: var(--surface-2); border-radius: 7px; padding: 5px 8px; font-weight: 600; font-size: 13px; max-width: 250px; }
.icon-btn.menu-btn { display: none; }
.content { padding: 24px 28px 120px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1440px; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.scrim { display: none; }

/* ---------- buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border-2); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.big { padding: 12px 18px; font-size: 15px; }
.btn.full { width: 100%; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.teal:hover { background: var(--teal-2); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.danger-ghost { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: transparent; }
.btn.danger-ghost:hover { background: var(--crit-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.light { background: #fff; color: #2A1A4F; border-color: #fff; }
.btn.outline-light { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .45); }
.btn.outline-light:hover { background: rgba(255, 255, 255, .1); }
.btn.ghost-dark { background: transparent; color: var(--side-fg); border-color: rgba(255, 255, 255, .18); }
.demo-btn { background: linear-gradient(135deg, #0FA59D, #7B4FD0); border: 0; color: #fff; padding: 11px 14px; font-size: 14px; box-shadow: 0 6px 20px rgba(15, 165, 157, .3); }
.demo-btn:hover { filter: brightness(1.08); background: linear-gradient(135deg, #0FA59D, #7B4FD0); }
.reset-btn { background: transparent; color: var(--side-fg); border-color: rgba(255, 255, 255, .14); }
.reset-btn:hover { background: rgba(255, 255, 255, .06); }
.demo-top { background: linear-gradient(135deg, #0FA59D, #7B4FD0); color: #fff; border: 0; }
.demo-top:hover { filter: brightness(1.08); background: linear-gradient(135deg, #0FA59D, #7B4FD0); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; margin-left: 8px; }
.link:hover { text-decoration: underline; }
select, input[type="text"], input:not([type]), input[type="time"], input[type="number"], textarea { background: var(--surface); border: 1px solid var(--border-2); border-radius: 9px; padding: 8px 10px; font-size: 13.5px; min-width: 0; }
select { cursor: pointer; }
textarea { resize: vertical; width: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg.big button { padding: 9px 14px; display: flex; align-items: center; gap: 8px; }
.seg.big em { font-style: normal; font-size: 11px; background: var(--surface-3); border-radius: 99px; padding: 1px 7px; color: var(--muted); }
.seg.big button.on em { background: var(--accent-soft); color: var(--accent-ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-2); border-radius: 9px; padding: 0 10px; flex: 1 1 240px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 9px 0; flex: 1; outline: none; }
.search:focus-within { border-color: var(--accent); }
.result-count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

/* ---------- tags & pills ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; border-radius: 6px; padding: 3px 10px; white-space: nowrap; }
.pill.sm { font-size: 11px; padding: 2px 8px; }
.st-sched { background: var(--st-sched); } .st-prog { background: var(--st-prog); } .st-done { background: var(--st-done); } .st-help { background: var(--st-help); }
.teamtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.teamtag i { width: 9px; height: 9px; border-radius: 3px; background: var(--tc); flex: none; }
.typetag { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.typetag.year { background: var(--accent-soft); color: var(--accent-ink); }
.typetag.event { background: var(--teal-soft); color: var(--teal-2); }
.ob { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.ob-done { background: var(--ok-soft); color: var(--ok); } .ob-prog { background: var(--warn-soft); color: var(--warn); } .ob-none { background: var(--crit-soft); color: var(--crit); }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; flex: none; letter-spacing: .02em; }
.avatar.ring { box-shadow: 0 0 0 2px var(--surface); }
.avatar.more { background: var(--surface-3); color: var(--fg-2); box-shadow: 0 0 0 2px var(--surface); }
.avstack { display: inline-flex; }
.avstack > * + * { margin-left: -7px; }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--teal-2); background: var(--teal-soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.short-badge { font-size: 11.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- cards & grids ---------- */
.page { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h3 { font-size: 16px; font-weight: 650; }
.card-h .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.span-2 { grid-column: span 2; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 10px; color: var(--muted); text-align: center; font-size: 13px; }
.empty strong { color: var(--fg-2); }
.empty .ico { color: var(--ok); }
.sec-h { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-family: var(--f-body); }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl.hover tbody tr { cursor: pointer; }
.tbl.hover tbody tr:hover { background: var(--surface-2); }
.cell-person { display: flex; align-items: center; gap: 9px; }
.cell-person span { display: flex; flex-direction: column; line-height: 1.25; }
.cell-person em { font-style: normal; font-size: 12px; color: var(--muted); }
.meter { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; flex: 1; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter.teal i { background: var(--teal); }
.cov { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.cov span { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- dashboard ---------- */
.hero { background: radial-gradient(120% 140% at 100% 0%, #13A39B 0%, rgba(19, 163, 155, 0) 45%), linear-gradient(120deg, #2A1650 0%, #4B2A8F 60%, #5B33A8 100%); color: #fff; border-radius: 16px; padding: 26px 28px; display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(#E40303, #FF8C00, #FFED00, #008026, #24408E, #732982); opacity: .9; }
.hero .eyebrow { color: rgba(255, 255, 255, .7); }
.hero h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 750; max-width: 30ch; margin: 6px 0 8px; line-height: 1.15; }
.hero-sub { color: rgba(255, 255, 255, .8); max-width: 60ch; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; text-align: left; box-shadow: var(--shadow); }
.kpi.clickable:hover { border-color: var(--border-2); transform: translateY(-1px); }
.kpi-l { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.kpi-v { font-family: var(--f-display); font-size: 34px; font-weight: 750; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi-v small { font-size: 22px; color: var(--muted); }
.kpi-s { font-size: 12.5px; color: var(--muted); }
.kpi .meter { margin-top: 8px; flex: none; }
.split { display: flex; height: 7px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: 8px; }
.split .y { background: var(--accent); } .split .e { background: var(--teal); }
.status-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.ss { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; text-align: left; position: relative; overflow: hidden; }
.ss::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.ss strong { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.ss span { font-size: 12.5px; color: var(--muted); font-weight: 600; line-height: 1.2; }
.ss.done::before { background: var(--st-done); } .ss.prog::before { background: var(--st-prog); } .ss.sched::before { background: var(--st-sched); } .ss.help::before { background: var(--st-help); } .ss.warn::before { background: var(--warn); } .ss.ok::before { background: var(--ok); }
.ss:hover { background: var(--surface-2); }
.att-list, .feed, .next-list, .room-asg, .issues, .gaps, .live-list, .scn-list, .gap-ans, .rank, .sum-list, .notes-mini, .checklist, .resp { list-style: none; margin: 0; padding: 0; }
.att-list { display: flex; flex-direction: column; gap: 6px; max-height: 330px; overflow-y: auto; }
.att-list button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 9px 11px; }
.att-list button:hover { background: var(--surface-2); }
.att-list li.crit .ico { color: var(--crit); } .att-list li.warn .ico { color: var(--warn); }
.att-list span:not(.pill):not(.short-badge) { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.att-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.feed { display: flex; flex-direction: column; }
.feed li { display: flex; gap: 12px; padding: 8px 0; position: relative; }
.feed li + li::before { content: ''; position: absolute; left: 4px; top: -8px; height: 16px; width: 2px; background: var(--border); }
.feed-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--st-sched); margin-top: 5px; flex: none; }
.feed p { font-size: 13.5px; }
.feed em { font-style: normal; font-size: 12px; color: var(--muted); }
.fk-location .feed-dot { background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.fk-flag .feed-dot, .fk-issue .feed-dot { background: var(--crit); } .fk-resolve .feed-dot, .fk-checkin .feed-dot { background: var(--ok); } .fk-message .feed-dot { background: var(--accent); }
.fk-location p { font-weight: 600; }
.feed.tall { max-height: 380px; overflow-y: auto; }
.next-list { display: flex; flex-direction: column; gap: 4px; }
.next-list button { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 8px; border-radius: 9px; text-align: left; }
.next-list button:hover { background: var(--surface-2); }
.nl-time { font-family: var(--f-mono); font-size: 13px; font-weight: 500; display: flex; flex-direction: column; min-width: 74px; }
.nl-time em { font-family: var(--f-body); font-style: normal; font-size: 11px; color: var(--muted); }
.nl-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.nl-main em { font-style: normal; font-size: 12px; color: var(--muted); }
.ready-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 3px; }
.r-complete { background: var(--ok); } .r-in-progress { background: var(--warn); } .r-not-started { background: var(--crit); }
.ready ul { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
.ready li { display: flex; align-items: center; gap: 8px; }
.ready li strong { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 3px; }

/* timeline */
.tl-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.tl-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 12px; height: 8px; border-radius: 3px; display: inline-block; }
.tl-scroll { overflow-x: auto; }
.tl-grid { min-width: 860px; }
.tl-row, .tl-axis { display: grid; grid-template-columns: 170px 1fr; align-items: stretch; }
.tl-row { border-top: 1px solid var(--border); }
.tl-label { padding: 8px 10px 8px 0; display: flex; align-items: center; font-size: 12.5px; }
.tl-track { position: relative; min-height: 32px; }
.tl-axis .tl-track { height: 20px; }
.tl-axis span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: .7; }
.tl-row.program .tl-track { height: 38px; }
.prg { position: absolute; height: 14px; font-size: 10.5px; font-weight: 700; line-height: 14px; padding: 0 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--accent-ink); }
.prg.main { background: var(--accent); color: #fff; } .prg.break { background: var(--surface-3); color: var(--muted); } .prg.ops { background: var(--teal-soft); color: var(--teal-2); }
.bar { position: absolute; height: 20px; border: 0; border-radius: 5px; padding: 0 6px; color: #fff; font-size: 11px; font-weight: 600; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; transition: filter .15s, transform .15s; }
.bar span { overflow: hidden; text-overflow: ellipsis; }
.bar:hover { filter: brightness(1.1); transform: translateY(-1px); z-index: 2; }
.bar.short { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .22) 0 5px, transparent 5px 10px); }
.now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); z-index: 3; }
.tl-row.program .now-line::before { content: 'NOW'; position: absolute; top: -2px; left: 4px; font-size: 9px; font-weight: 800; color: var(--crit); letter-spacing: .05em; }

/* ---------- directory ---------- */
.vol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.vol-card { display: flex; flex-direction: column; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; position: relative; }
.vol-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.vc-top { display: flex; gap: 12px; align-items: center; }
.vc-top div { display: flex; flex-direction: column; min-width: 0; }
.vc-top strong { font-size: 15px; }
.vc-top span { font-size: 12.5px; color: var(--muted); }
.vc-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 0; }
.vc-meta dt, .facts dt { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.vc-meta dd, .facts dd { margin: 0; font-size: 13px; font-weight: 500; }
.vc-joined { position: absolute; top: 14px; right: 14px; font-size: 10.5px; font-weight: 700; color: var(--muted); }

/* drawer & modal */
.drawer-wrap, .modal-wrap { position: fixed; inset: 0; background: rgba(17, 10, 30, .42); z-index: 60; display: flex; justify-content: flex-end; animation: fadein .15s; }
.drawer { width: min(520px, 100%); height: 100%; background: var(--surface); overflow-y: auto; padding: 26px 26px 60px; padding-right: max(26px, env(safe-area-inset-right, 0px)); position: relative; box-shadow: var(--shadow-lg); animation: slidein .22s ease; }
.drawer.wide { width: min(640px, 100%); }
@keyframes slidein { from { transform: translateX(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer-x { position: absolute; top: 14px; right: 14px; z-index: 2; }
.modal-wrap { justify-content: center; align-items: center; }
.modal { background: var(--surface); border-radius: 14px; padding: 20px; width: min(520px, calc(100% - 32px)); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.profile-head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; padding-right: 30px; }
.profile-head h2 { font-size: 24px; }
.profile-head p { color: var(--muted); margin-bottom: 8px; }
.bio { color: var(--fg-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.profile-actions { margin: 14px 0; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
.facts .full { grid-column: span 2; }
.checklist { display: flex; flex-direction: column; gap: 6px; }
.checklist label, .resp label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); }
.checklist input, .resp input { accent-color: var(--accent); width: 17px; height: 17px; margin-top: 1px; flex: none; }
.checklist label:has(input:checked) span, .resp label:has(input:checked) span { color: var(--muted); text-decoration: line-through; }
.mini-day h5 { font-size: 13px; margin: 10px 0 6px; font-family: var(--f-body); color: var(--fg-2); }
.mini-asg { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 9px 11px; text-align: left; margin-bottom: 6px; }
.mini-asg:hover { background: var(--surface-2); }
.mini-asg.ph-past { opacity: .65; }
.ma-time { font-family: var(--f-mono); font-size: 12px; min-width: 132px; color: var(--fg-2); }
.ma-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ma-main em { font-style: normal; font-size: 12px; color: var(--muted); }
.notes-mini { display: flex; flex-direction: column; gap: 8px; }
.notes-mini li { display: flex; flex-direction: column; font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }
.notes-mini span { color: var(--muted); font-size: 12.5px; }

/* ---------- portal ---------- */
.portal-page { align-items: center; }
.sim-bar { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px); border: 1px dashed var(--border-2); border-radius: 12px; padding: 10px 12px; }
.sim-lab { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .05em; }
.sim-bar select { flex: 1 1 260px; font-weight: 600; }
.sim-note { font-size: 12px; color: var(--muted); }
.portal { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.p-hello { display: flex; gap: 14px; align-items: center; }
.p-hello h2 { font-size: 30px; font-weight: 750; line-height: 1.05; }
.p-small { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bell { position: relative; width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--fg-2); }
.bell.has { color: var(--accent); border-color: var(--accent); animation: ring 1.6s ease 2; }
.bell em { position: absolute; top: -6px; right: -6px; background: var(--crit); color: #fff; font-style: normal; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 5px; box-shadow: 0 0 0 3px var(--bg); }
@keyframes ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(12deg); } 30% { transform: rotate(-10deg); } 45% { transform: rotate(6deg); } 60% { transform: rotate(0); } }
.notif-tray { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 14px; }
.nt-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.notif-tray ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
.notif-tray li button { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 3px; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
.notif-tray li.unread button { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.notif-tray li.unread.nk-location button { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 45%, transparent); }
.notif-tray li span { font-size: 13px; color: var(--fg-2); }
.notif-tray li .was { color: var(--muted); text-decoration: line-through; font-size: 12px; }
.notif-tray li em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.nt-foot { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.change-banner { display: flex; gap: 12px; align-items: center; background: linear-gradient(120deg, #0B8C86, #0E6F8C); color: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 26px rgba(11, 140, 134, .3); animation: pop .4s ease; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.change-banner div { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.change-banner span { font-size: 13px; opacity: .92; }
.first-timer { display: flex; gap: 10px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }
.first-timer p { color: var(--fg-2); }
.first-timer .ico { margin-top: 2px; color: var(--accent); }
.up-next { text-align: left; border: 0; border-radius: 18px; padding: 20px; background: linear-gradient(140deg, #2C1856, #5532A6); color: #fff; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 14px 34px rgba(60, 30, 120, .28); position: relative; overflow: hidden; }
.up-next::after { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(19, 196, 186, .55), transparent 70%); }
.up-next.live { background: linear-gradient(140deg, #08615D, #0B8C86 55%, #3E5DB8); }
.up-next.done { background: var(--surface); color: var(--fg); border: 1px solid var(--border); box-shadow: none; }
.up-next.done::after { display: none; }
.un-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #7CF5E9; box-shadow: 0 0 0 0 rgba(124, 245, 233, .7); animation: livepulse 1.6s infinite; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(124, 245, 233, .7); } 70% { box-shadow: 0 0 0 10px rgba(124, 245, 233, 0); } 100% { box-shadow: 0 0 0 0 rgba(124, 245, 233, 0); } }
.un-title { font-family: var(--f-display); font-size: 24px; font-weight: 750; line-height: 1.15; position: relative; z-index: 1; }
.un-row { display: flex; align-items: center; gap: 8px; font-size: 14px; opacity: .95; position: relative; z-index: 1; }
.un-arrive { align-self: flex-start; background: rgba(255, 255, 255, .16); border-radius: 99px; padding: 3px 11px; font-size: 12.5px; font-weight: 700; }
.un-go { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; margin-top: 4px; position: relative; z-index: 1; }
.p-contact { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; flex-wrap: wrap; }
.p-contact > div:first-child { display: flex; flex-direction: column; }
.p-contact > div:first-child > span:last-child { font-size: 12.5px; color: var(--muted); }
.p-contact-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.radio { display: inline-flex; align-items: center; gap: 5px; background: var(--teal-soft); color: var(--teal-2); font-weight: 700; font-size: 12px; border-radius: 99px; padding: 2px 9px; }
.p-days { width: 100%; }
.p-days button { flex: 1; justify-content: center; flex-direction: column; gap: 0 !important; }
.p-days button em { background: none !important; padding: 0 !important; }
.p-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.p-list li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; position: relative; }
.p-list li.none { display: block; color: var(--muted); text-align: center; padding: 20px; }
.pl-time { display: flex; flex-direction: column; padding-top: 12px; white-space: nowrap; font-family: var(--f-mono); font-size: 13px; text-align: right; }
.pl-time span { color: var(--muted); font-size: 11.5px; }
.pl-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; min-width: 0; }
.pl-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.pl-card strong { font-size: 15px; line-height: 1.3; }
.pl-card.changed { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.pl-top { display: flex; align-items: center; gap: 8px; }
.pl-dur { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
.chg { font-size: 11px; font-weight: 800; color: #fff; background: var(--teal); border-radius: 6px; padding: 2px 8px; text-transform: uppercase; letter-spacing: .04em; }
.pl-loc { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--fg-2); flex-wrap: wrap; }
.pl-loc b { margin-left: 4px; font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent-ink); border-radius: 99px; padding: 1px 8px; }
.pl-mates { font-size: 12.5px; color: var(--muted); }
.p-list li.ph-past .pl-card { opacity: .62; }
.p-list li.ph-now .pl-card { border-color: var(--teal); }
.p-list li.ph-now .pl-time strong { color: var(--teal-2); }
.p-onboard { background: var(--warn-soft); border-radius: 14px; padding: 14px 16px; }
.p-onboard ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.p-onboard li { display: flex; gap: 7px; align-items: center; color: var(--warn); }
.p-onboard li.ok { color: var(--ok); text-decoration: line-through; }

/* task sheet */
.sheet { display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-size: 24px; padding-right: 30px; line-height: 1.2; }
.sh-top { display: flex; gap: 10px; align-items: center; }
.sh-when { display: grid; grid-template-columns: 1.4fr 1.2fr .8fr; gap: 8px; }
.sh-when div { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; display: flex; flex-direction: column; min-width: 0; }
.sh-when span { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sh-when strong { font-size: 13.5px; }
.sh-loc { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sh-loc-h { display: flex; gap: 10px; align-items: flex-start; }
.sh-loc-h .ico { color: var(--accent); margin-top: 2px; }
.sh-loc-h div { display: flex; flex-direction: column; }
.sh-loc-h strong { font-size: 16px; }
.sh-loc-h span { font-size: 12.5px; color: var(--muted); }
.moved { background: var(--teal-soft); color: var(--teal-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; text-decoration: none; }
.dir { color: var(--fg-2); font-size: 13.5px; }
.sh-mini { border-radius: 10px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
.resp { display: flex; flex-direction: column; gap: 6px; }
.sh-report p { background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.sh-report .sec-h { margin-top: 0; }
.sh-people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sup-card, .mates { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sup-card > span:nth-child(3) { font-size: 12.5px; color: var(--muted); }
.sup-c { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; }
.mates { gap: 8px; }
.mate { display: flex; align-items: center; gap: 9px; text-align: left; background: none; border: 0; padding: 0; }
.mate span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.mate strong { font-size: 13px; }
.mate em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.sh-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.checked { display: inline-flex; gap: 6px; align-items: center; color: var(--ok); font-weight: 700; font-size: 13px; }
.help-form { display: flex; flex-direction: column; gap: 8px; background: var(--crit-soft); padding: 12px; border-radius: 12px; }
.help-form label { font-size: 12.5px; font-weight: 600; }
.brief-toggle { align-self: flex-start; margin: 0; }
.instr { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.instr-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 12px; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--muted); }
.instr pre { margin: 0; padding: 12px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--fg-2); }

/* ---------- map ---------- */
.floorplan { width: 100%; height: auto; display: block; }
.fp-shell { fill: var(--fp-shell); stroke: var(--border-2); stroke-width: 3; }
.fp-corridor { fill: var(--surface-3); }
.fp-fixed rect { fill: var(--fp-fixed); stroke: var(--border); stroke-dasharray: 6 5; }
.fp-fixed.core rect { fill: var(--surface-3); stroke-dasharray: none; }
.fp-fixed text { fill: var(--muted); font-size: 17px; font-family: var(--f-body); font-weight: 600; }
.fp-fixed .fp-acc { font-size: 13px; font-weight: 500; }
.fp-room { cursor: pointer; }
.fp-room rect:first-child { fill: var(--fp-room); stroke: var(--fp-room-stroke); stroke-width: 2; transition: fill .15s, stroke .15s; }
.fp-room.idle rect:first-child { fill: var(--surface); }
.fp-room:hover rect:first-child { fill: var(--accent-soft); stroke: var(--accent); }
.fp-room.live rect:first-child { stroke: var(--teal); stroke-width: 3; }
.fp-room.sel rect:first-child { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 4; }
.fp-room.hl rect:first-child { fill: color-mix(in srgb, var(--teal) 22%, var(--surface)); stroke: var(--teal); stroke-width: 4; }
.fp-room:focus-visible { outline: none; }
.fp-room:focus-visible rect:first-child { stroke: var(--accent); stroke-width: 5; }
.fp-pulse { fill: none; stroke: var(--teal); stroke-width: 4; animation: fppulse 1.4s ease-in-out infinite; }
@keyframes fppulse { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
.fp-name { fill: var(--fp-text); font-family: var(--f-display); font-weight: 650; font-size: 24px; pointer-events: none; }
.fp-sub { fill: var(--muted); font-size: 15px; font-family: var(--f-body); font-weight: 600; pointer-events: none; }
.fp-live circle { fill: var(--teal); animation: fppulse 1.6s infinite; }
.fp-live text { fill: var(--teal-2); font-size: 13px; font-weight: 700; font-family: var(--f-body); }
.fp-pin path { fill: var(--crit); } .fp-pin circle { fill: #fff; }
.fp-door circle { fill: var(--accent); }
.fp-door text { fill: var(--accent-ink); font-size: 14px; font-weight: 700; font-family: var(--f-body); }
.fp-floorlab { fill: var(--muted); font-size: 12px; letter-spacing: .14em; font-weight: 700; font-family: var(--f-body); }
.floorplan.mini .fp-name { font-size: 26px; }
.floorplan.mini .fp-fixed text { font-size: 20px; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.map-card { padding: 14px; }
.map-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 10px 4px 0; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.lg-room { background: var(--fp-room); border: 1px solid var(--fp-room-stroke); } .lg-live { border: 2px solid var(--teal); } .lg-hl { background: var(--teal); } .lg-core { background: var(--surface-3); }
.floors button b { font-family: var(--f-display); font-size: 16px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-3); }
.floors button.on b { background: var(--accent); color: #fff; }
.room-panel { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
.room-asg { display: flex; flex-direction: column; gap: 8px; }
.room-asg button { width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.room-asg button:hover { border-color: var(--accent); }
.room-asg li.now button { border-color: var(--teal); }
.room-asg li.focus button { box-shadow: 0 0 0 3px var(--teal-soft); border-color: var(--teal); }
.ra-top, .ra-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ra-top .mono { font-size: 12px; color: var(--muted); }
.ra-names { font-size: 12px; color: var(--muted); }
.focus-banner { display: flex; align-items: center; gap: 10px; background: var(--teal-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--teal) 40%, transparent); border-radius: 12px; padding: 10px 12px; flex-wrap: wrap; }
.focus-banner > .ico { color: var(--teal-2); }
.focus-banner > span { flex: 1 1 260px; font-size: 13.5px; }

/* ---------- assignments board ---------- */
.board { display: flex; flex-direction: column; gap: 18px; }
.group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; border-left: 5px solid var(--tc); }
.group-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; background: transparent; text-align: left; flex-wrap: wrap; }
.group-h strong { color: var(--tc); font-family: var(--f-display); font-size: 16px; }
.group-h .muted { font-size: 12.5px; }
.group-bar { margin-left: auto; display: flex; width: 160px; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; }
.board-tbl th { background: var(--surface-2); }
.board-tbl td { padding: 6px 10px; }
.board-tbl tbody tr { cursor: pointer; }
.board-tbl tbody tr:hover td { background: var(--surface-2); }
.board-tbl tr.conflict td { background: var(--crit-soft); }
.c-task { min-width: 260px; }
.task-cell { display: flex; flex-direction: column; gap: 2px; }
.task-cell strong { font-weight: 600; font-size: 13.5px; }
.flag-c { display: inline-flex; gap: 4px; align-items: center; color: var(--crit); font-size: 11px; font-weight: 700; }
.c-loc select { width: 100%; min-width: 180px; padding: 5px 8px; font-size: 13px; background: transparent; border-color: transparent; }
.c-loc select:hover, .c-loc select:focus { border-color: var(--border-2); background: var(--surface); }
.c-st { width: 140px; padding: 0 !important; }
.status-cell { width: 100%; height: 44px; border: 0; border-radius: 0; color: #fff; font-weight: 700; font-size: 12.5px; text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; padding: 0 8px; }
.status-cell option { color: var(--fg); background: var(--surface); }
.vol-cell { display: flex; align-items: center; gap: 8px; }
.fill { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.fill.short { color: var(--warn); }

/* editor */
.editor { display: flex; flex-direction: column; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 12px; font-weight: 700; color: var(--muted); }
.fld input, .fld select, .fld textarea { width: 100%; }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld-row.three { grid-template-columns: 1.3fr 1fr 1fr; }
.hint { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 4px 3px 3px; font-size: 12.5px; font-weight: 600; }
.chip.bad { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }
.chip button { border: 0; background: transparent; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: var(--muted); }
.chip button:hover { background: var(--surface-3); }
.warn-box { display: flex; gap: 8px; background: var(--crit-soft); color: var(--crit); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.warn-box p { color: var(--fg); }
.sugg { display: flex; flex-direction: column; gap: 6px; background: var(--teal-soft); border-radius: 10px; padding: 10px; }
.sugg.compact { background: transparent; padding: 0; }
.sugg-h { display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 600; color: var(--fg-2); flex-wrap: wrap; }
.sugg-item { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; }
.sugg-item:hover, .sugg-item.on { border-color: var(--teal); }
.sugg-item span { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sugg-item em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.resp-edit { display: flex; gap: 8px; align-items: center; }
.resp-edit input { flex: 1; }
.notify-box { background: var(--surface-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.err { color: var(--crit); font-weight: 600; }
.editor-foot { display: flex; gap: 8px; align-items: center; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 4px; position: sticky; bottom: -60px; background: var(--surface); padding-bottom: 10px; flex-wrap: wrap; }
.confirm-inline { display: inline-flex; gap: 6px; }

/* ---------- operations ---------- */
.scenario { border: 2px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%); }
.scenario.done { border-color: var(--teal); background: linear-gradient(180deg, var(--teal-soft), var(--surface) 70%); }
.scn-flow { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.scn-flow > .ico { color: var(--accent); }
.scn-loc { flex: 1 1 220px; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); }
.scn-loc span { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.scn-loc strong { font-family: var(--f-display); font-size: 18px; }
.scn-loc em { font-style: normal; font-size: 12.5px; color: var(--muted); }
.scn-loc.from strong { text-decoration: line-through; text-decoration-color: var(--crit); text-decoration-thickness: 2px; }
.scenario.done .scn-loc.to { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.scn-aff { margin-bottom: 8px; }
.scn-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.scn-list li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; font-weight: 600; font-size: 13px; flex-wrap: wrap; }
.scn-list li .mono { color: var(--muted); font-weight: 500; min-width: 170px; }
.scn-list li .avstack { margin-left: auto; }
.scenario .fld { margin-bottom: 12px; }
.scn-done { display: flex; flex-direction: column; gap: 12px; }
.scn-done p { display: flex; gap: 8px; align-items: flex-start; }
.scn-done p .ico { color: var(--ok); margin-top: 2px; }
.scn-people { display: flex; flex-wrap: wrap; gap: 8px; }
.scn-people .mate { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px 6px 6px; }
.scn-people .mate:hover { border-color: var(--teal); }
.scn-done .btn { align-self: flex-start; }
.live-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
.live-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; flex-wrap: wrap; }
.live-list li.help { border-color: var(--crit); background: var(--crit-soft); }
.ll-main { flex: 1 1 180px; text-align: left; border: 0; background: none; padding: 0; display: flex; flex-direction: column; min-width: 0; }
.ll-main em { font-style: normal; font-size: 12px; color: var(--muted); }
.issues { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; margin-bottom: 12px; }
.issues li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.issues li p { font-size: 12.5px; color: var(--fg-2); }
.issues li em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.sev { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; border-radius: 6px; padding: 2px 7px; }
.sev-high .sev { background: var(--crit); color: #fff; } .sev-medium .sev { background: var(--warn-soft); color: var(--warn); } .sev-low .sev { background: var(--surface-3); color: var(--muted); }
.sev-high { border-color: color-mix(in srgb, var(--crit) 45%, transparent) !important; }
.iss-act { display: flex; gap: 4px; }
.inline-form { display: flex; gap: 6px; flex-wrap: wrap; }
.inline-form input { flex: 1 1 180px; }
.gaps { display: flex; flex-direction: column; gap: 6px; }
.gaps li, .gap-ans li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; flex-wrap: wrap; }
.gaps li > div, .gap-ans li > div { flex: 1 1 200px; display: flex; flex-direction: column; min-width: 0; }
.gaps em, .gap-ans em { font-style: normal; font-size: 12px; color: var(--muted); }
.tool { display: flex; flex-direction: column; gap: 10px; }
.tool select, .tool input { width: 100%; }
.send-form { display: flex; flex-direction: column; gap: 10px; }
.send-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.aud-preview { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }

/* ---------- assistant ---------- */
.ai-hero { display: flex; gap: 18px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.ai-mark { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, #0FA59D, #7B4FD0); color: #fff; flex: none; }
.ai-hero h2 { font-size: 22px; margin-bottom: 4px; }
.ai-hero p { color: var(--fg-2); max-width: 70ch; }
.ai-disclaimer { margin-top: 10px; display: flex; gap: 6px; align-items: flex-start; background: var(--warn-soft); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; }
.ai-disclaimer .ico { color: var(--warn); margin-top: 2px; }
.prompt-row { display: flex; flex-wrap: wrap; gap: 8px; }
.prompt { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--border-2); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.prompt:hover { border-color: var(--teal); background: var(--teal-soft); }
.prompt .ico { color: var(--teal-2); }
.thread { display: flex; flex-direction: column; gap: 14px; }
.ans header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ans .q { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-family: var(--f-display); font-size: 15px; flex: 1; }
.ans-lead { color: var(--fg-2); margin-bottom: 10px; }
.ans-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ans-pick select { flex: 1 1 240px; }
.ans-actions { margin-top: 10px; }
.sum-list { display: flex; flex-direction: column; gap: 6px; }
.sum-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); }
.sum-list li > i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.lv-critical > i { background: var(--crit); } .lv-warn > i { background: var(--warn); } .lv-info > i { background: var(--st-sched); } .lv-ok > i { background: var(--ok); }
.gap-ans { display: flex; flex-direction: column; gap: 6px; }
.rank { display: flex; flex-direction: column; gap: 6px; counter-reset: r; }
.rank li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.rank li > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rank li em { font-style: normal; font-size: 12px; color: var(--muted); }
.rank li.no { opacity: .55; }

/* ---------- tour & toasts ---------- */
.tour { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); background: #1D1330; color: #EDE7FA; border-radius: 16px; padding: 16px 18px; box-shadow: 0 18px 50px rgba(20, 10, 40, .45); z-index: 80; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255, 255, 255, .1); }
.tour-top { display: flex; align-items: center; gap: 8px; }
.tour-top .icon-btn { color: #A99FC4; width: 28px; height: 28px; }
.tour-top .icon-btn:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.tour-step { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6FE0D8; flex: 1; }
.tour-time { font-size: 12px; color: #A99FC4; }
.tour-dots { display: flex; gap: 5px; }
.tour-dots button { flex: 1; height: 5px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .15); padding: 0; }
.tour-dots button.past { background: #7B4FD0; } .tour-dots button.on { background: #2BC9BF; }
.tour h3 { font-size: 19px; color: #fff; }
.tour p { font-size: 14px; color: #D3CAE8; line-height: 1.55; }
.tour-nav { display: flex; justify-content: space-between; }
.tour .ghost-dark:disabled { opacity: .3; }
.pulse { animation: btnpulse 1.4s infinite; }
@keyframes btnpulse { 0% { box-shadow: 0 0 0 0 rgba(43, 201, 191, .6); } 70% { box-shadow: 0 0 0 12px rgba(43, 201, 191, 0); } 100% { box-shadow: 0 0 0 0 rgba(43, 201, 191, 0); } }
.tour-glow { outline: 3px solid #2BC9BF !important; outline-offset: 4px; border-radius: 14px; animation: glow 1.8s ease-in-out infinite; position: relative; z-index: 5; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(43, 201, 191, .35); } 50% { box-shadow: 0 0 0 10px rgba(43, 201, 191, .12); } }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-lg); animation: pop .25s ease; }
.toast .ico { color: var(--ok); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .status-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .map-layout { grid-template-columns: 1fr; }
  .room-panel { position: static; max-height: none; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; transform: translateX(-105%); transition: transform .22s ease; padding-top: max(20px, env(safe-area-inset-top, 0px)); }
  .nav-open .sidebar { transform: none; box-shadow: var(--shadow-lg); }
  .nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(17, 10, 30, .45); z-index: 35; }
  .icon-btn.menu-btn { display: inline-grid; }
  .topbar { padding: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); top: env(safe-area-inset-top, 0px); flex-wrap: wrap; gap: 8px; }
  .topbar h1 { font-size: 18px; }
  .clock { order: 3; flex: 1 1 100%; }
  .clock select { flex: 1; max-width: none; }
  .demo-top span { display: none; }
  .content { padding: 16px 16px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid-2 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 12px; } .kpi-v { font-size: 26px; }
  .status-strip { grid-template-columns: 1fr 1fr; }
  .hero { padding: 20px; }
  .p-hello h2 { font-size: 24px; }
  .p-list li { grid-template-columns: 62px 1fr; gap: 8px; }
  .pl-time { font-size: 11.5px; }
  .sh-when { grid-template-columns: 1fr 1fr; }
  .sh-when div:first-child { grid-column: span 2; }
  .sh-people { grid-template-columns: 1fr; }
  .fld-row, .fld-row.three { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr; } .facts .full { grid-column: auto; }
  .drawer { padding: 20px 16px 60px; }
  .sim-note { display: none; }
  .seg.big.floors button { padding: 8px 9px; font-size: 12px; }
