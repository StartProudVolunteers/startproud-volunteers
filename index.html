<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OOBS Volunteer Assistant</title>
  <meta name="description" content="Concept demo volunteer assistant for Out on Bay Street.">
  <meta name="theme-color" content="#1b1440">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
  <div class="pride-bar" aria-hidden="true"></div>
  <header class="hero">
    <p class="eyebrow" data-text="event.venue"></p>
    <h1 data-text="event.name"></h1>
    <p class="sub" data-text="event.dates"></p>
    <p class="lede" data-text="event.tagline"></p>
    <div class="hero-actions">
      <button class="btn btn-catchup" type="button" data-catchup></button>
      <a class="btn btn-ghost" data-myday href="my-day.html">My day</a>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title" data-text="ui.homeHeading"></h2>
    <ul class="station-list" id="station-list"></ul>
    <p class="note" data-text="ui.allStationsNote"></p>
  </main>

  <footer class="footer" data-text="ui.footer"></footer>
  <script src="assets/app.js"></script>
</body>
</html>
